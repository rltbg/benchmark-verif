[package]
name = "bench-rust"
version = "0.1.0"
edition = "2024"
description = "Workloads de benchmark en Rust, vérifiés avec Creusot (les contrats sont effacés par un `cargo build` normal)"

[lib]
name = "bench_rust"
path = "src/lib.rs"

[[bin]]
name = "bench-rust"
path = "src/bin/bench.rs"

[dependencies]
creusot-std = "0.15.0-dev"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(creusot)'] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
